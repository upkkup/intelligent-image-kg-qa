name: CI
on:
  push:
    branches: [main, "deploy/**"]
  pull_request:
    branches: [main]
jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Keep CI lightweight: these tests mock YOLO and remote services.
      - run: pip install "fastapi>=0.115,<1" "python-multipart>=0.0.9" "pillow>=10.3" "requests>=2.32" "openai>=1.40" "pytest>=8.0" "httpx>=0.27"
      - run: PYTHONPATH=api pytest -q api/tests
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web && npm install && npm run build
